name: suite

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # The resilience layer only runs here: it stops containers, so it is
    # too slow and too disruptive to gate every push on.
    - cron: "0 3 * * *"

env:
  UV_FROZEN: "1"

jobs:
  # Seconds, and no stand. Anything broken here would break everything
  # below, so it goes first and fails fast.
  static:
    name: style, types, layers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check src tests scripts docs
      - run: uv run mypy src scripts

  # Seconds, and no stand either. A suite that tests somebody else's
  # product should be able to say something about its own supply chain.
  supply-chain:
    name: secrets and dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # The working tree, not the history: see the note in .gitleaks.toml.
      # A secret reaching the repository is the thing to stop, and this
      # project has a reason to care — the report it publishes carried
      # three thousand session tokens before the transport layer learned to
      # redact them.
      - name: no secrets in the repository
        run: >
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest
          detect --source=/repo --no-git --redact --verbose --config=/repo/.gitleaks.toml

      # Audited from the lock file rather than from the environment, so what
      # is checked is what CI actually installs.
      - name: no known vulnerabilities in what we depend on
        run: |
          uv export --frozen --no-emit-project --all-extras --format requirements-txt -o requirements.txt
          uvx pip-audit --requirement requirements.txt --disable-pip

  self-test:
    name: the framework's own tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --extra dev
      # No stand on purpose: these must pass with the product switched
      # off, or they are not unit tests. They also hold the documentation
      # to what the suite actually contains.
      - run: uv run pytest tests/unit -q

  # The critical path across both layers, in under a minute of tests. It
  # gates the full suites so an obviously broken stand fails here rather
  # than inside eight hundred results.
  smoke:
    name: smoke
    runs-on: ubuntu-latest
    needs: [static, self-test]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run playwright install chromium --with-deps

      - name: bring the stand up
        run: docker compose -f docker/docker-compose.yml up -d --quiet-pull
      - name: wait for the stand
        run: uv run python scripts/check_stand.py

      - run: uv run pytest -m smoke tests/api tests/ui -q

      - name: stand logs on failure
        if: failure()
        run: docker compose -f docker/docker-compose.yml logs --tail 300

  api:
    name: api suite
    runs-on: ubuntu-latest
    needs: [smoke]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --extra dev

      - name: bring the stand up
        run: docker compose -f docker/docker-compose.yml up -d --quiet-pull

      # `up` returns before the product answers, so the gate is not
      # optional. It also proves the stand end to end before any test
      # blames the product for a stand that was never ready.
      - name: wait for the stand
        run: uv run python scripts/check_stand.py

      # --fail-uncovered turns a silently skipped family into a red run.
      # Every P0 check lives in this layer, and one of them once stopped
      # running for weeks without anyone noticing.
      - run: >
          uv run pytest tests/api -n 8
          --fail-uncovered P0
          --alluredir=allure-results

      - name: stand logs on failure
        if: failure()
        run: docker compose -f docker/docker-compose.yml logs --tail 300

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-api
          path: allure-results

  ui:
    name: browser suite
    runs-on: ubuntu-latest
    needs: [smoke]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run playwright install chromium --with-deps

      - name: bring the stand up
        run: docker compose -f docker/docker-compose.yml up -d --quiet-pull
      - name: wait for the stand
        run: uv run python scripts/check_stand.py

      # One retry, and only here. A browser test that needs it gets fixed
      # or deleted; the retry exists to capture a trace, not to turn a
      # run green. The api suite gets none at all.
      - run: >
          uv run pytest tests/ui -n 4
          --reruns 1 --reruns-delay 0
          --tracing retain-on-failure
          --video retain-on-failure
          --alluredir=allure-results

      # Only the results, and on their own. Uploading them beside
      # test-results nests both a directory deeper in the artifact, and
      # the report job then finds no results at all: the published report
      # had no browser tests in it for exactly that reason.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-ui
          path: allure-results

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-traces
          path: test-results

  # The promise every finding makes, kept honest. Its own job and its own
  # stand, so it runs beside the suites rather than after them and costs the
  # pipeline no wall-clock time — three of these reproductions stop a
  # container, which is exactly why they cannot share one.
  reproductions:
    name: the findings still reproduce
    runs-on: ubuntu-latest
    needs: [static, self-test]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - name: bring the stand up
        run: docker compose -f docker/docker-compose.yml up -d --quiet-pull
      - name: wait for the stand
        run: uv run python scripts/check_stand.py
      # Every report in docs/findings says it can be reproduced in about two
      # minutes without trusting the author. Nothing ran these, so a script
      # that stopped reproducing — because the product was fixed, or because
      # it rotted — would have gone unnoticed until a reader tried it.
      - run: uv run python scripts/verify_findings.py
      - name: stand logs on failure
        if: failure()
        run: docker compose -f docker/docker-compose.yml logs --tail 300

  resilience:
    name: dependency outages
    runs-on: ubuntu-latest
    # Never on a push. It stops containers out from under itself, so it
    # is slow and unstable by nature, and a main pipeline that is
    # sometimes red for that reason is worth less than a smaller one that
    # is always honest.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - name: bring the stand up
        run: docker compose -f docker/docker-compose.yml up -d --quiet-pull
      - name: wait for the stand
        run: uv run python scripts/check_stand.py
      # --resilience both includes the layer and keeps it in one process:
      # an outage cannot be confined to the test that caused it.
      - run: uv run pytest tests/resilience --resilience --alluredir=allure-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-resilience
          path: allure-results

  report:
    name: publish the report
    runs-on: ubuntu-latest
    needs: [api, ui, resilience]
    if: always() && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          pattern: allure-*
          merge-multiple: true
          path: allure-results
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: keep the history so trends survive
        uses: actions/checkout@v5
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages
      - run: |
          if [ -d gh-pages/history ]; then cp -r gh-pages/history allure-results/; fi
          npx --yes allure-commandline generate allure-results -o allure-report --clean
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
