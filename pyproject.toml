[project]
name = "vikunja-qa"
version = "0.1.0"
description = "Reference API and UI test framework, exercised against Vikunja"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "requests>=2.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pytest>=8.3",
    "pytest-xdist>=3.6",
    "allure-pytest>=2.13",
    "jsonschema>=4.23",
    "psycopg[binary]>=3.2",
    "pytest-playwright>=0.5",
    "pytest-rerunfailures>=15",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "types-requests>=2.32",
    "types-jsonschema>=4.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vikunja_qa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The resilience group stops containers, so it never joins the main run.
# It is a separate CI job, and the reason is written down in its module.
addopts = "-ra --strict-markers --strict-config -m 'not resilience'"
markers = [
    "serial: touches global state; must not run in parallel with others",
    "resilience: brings a dependency down; excluded from the main run",
    "cve: regression for a published vulnerability",
    "xversion: compares the v1 and v2 APIs",
]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PT", "RET", "SIM", "ARG"]

[tool.ruff.lint.per-file-ignores]
# BaseHTTPRequestHandler dictates these method names.
"docker/webhook-receiver/app.py" = ["N815"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true

