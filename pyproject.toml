[project]
name = "vikunja-qa"
version = "0.1.0"
description = "Reference API and UI test framework, exercised against Vikunja"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "requests>=2.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pytest>=8.3",
    "pytest-xdist>=3.6",
    "allure-pytest>=2.13",
    "jsonschema>=4.23",
    "psycopg[binary]>=3.2",
    "pytest-playwright>=0.5",
    "pytest-rerunfailures>=15",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "types-requests>=2.32",
    "types-jsonschema>=4.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vikunja_qa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Markers are registered by the suite's own plugin, vikunja_qa.testing.plugin,
# which also derives one per coverage matrix check; `pytest --markers` lists
# them all. The resilience layer is left out there too, by directory, unless
# --resilience is given, so -m stays free for whoever runs the suite.
# importlib import mode lets modules in different areas share a name, such
# as api/side_effects/test_mail.py and resilience/dependencies/test_mail.py,
# without turning every test directory into a package.
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
filterwarnings = ["error"]
# Every xfail in this suite pins a defect that is written up in docs/findings,
# and each one says in its own reason that it should turn into an unexpected
# pass when the product changes. Without this it could not: a non-strict xfail
# has no outcome that ends a run red, so a finding that got fixed would leave
# a stale marker behind and nothing would say so. The two markers that opt out
# again are the ones measuring a timeout, and they say why where they stand.
xfail_strict = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PT", "RET", "SIM", "ARG"]

[tool.ruff.lint.per-file-ignores]
# BaseHTTPRequestHandler dictates these method names.
"docker/webhook-receiver/app.py" = ["N815"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
# Checked: src and scripts, which is what CI runs and what the badge means.
#
# Not the tests, and the reason is worth stating rather than leaving a reader
# to wonder. Two areas deliberately hold a module of the same name —
# api/side_effects/test_mail.py beside resilience/dependencies/test_mail.py —
# which is what pytest's importlib mode is for, and mypy refuses the pair as a
# duplicate unless it is given explicit package bases. Given those, it then
# resolves `vikunja_qa` through the editable install rather than through src,
# and every `from vikunja_qa import stand` reads as a missing attribute. The
# way out is to restructure the package or the test tree to suit the type
# checker, and neither is worth doing to a suite that is already held by ruff,
# 244 tests of its own, and a plugin that refuses a module breaking its
# conventions. What the tests get instead is annotations that a reader can
# rely on, not ones a tool has verified.
mypy_path = "src"

