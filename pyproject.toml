[project]
name = "vikunja-qa"
version = "0.1.0"
description = "Reference API and UI test framework, exercised against Vikunja"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "requests>=2.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pytest>=8.3",
    "pytest-xdist>=3.6",
    "allure-pytest>=2.13",
    "jsonschema>=4.23",
    "psycopg[binary]>=3.2",
    "pytest-playwright>=0.5",
    "pytest-rerunfailures>=15",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "types-requests>=2.32",
    "types-jsonschema>=4.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vikunja_qa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Markers are registered by the suite's own plugin, vikunja_qa.testing.plugin,
# which also derives one per coverage matrix check; `pytest --markers` lists
# them all. The resilience layer is left out there too, by directory, unless
# --resilience is given, so -m stays free for whoever runs the suite.
# importlib import mode lets modules in different areas share a name, such
# as api/side_effects/test_mail.py and resilience/dependencies/test_mail.py,
# without turning every test directory into a package.
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PT", "RET", "SIM", "ARG"]

[tool.ruff.lint.per-file-ignores]
# BaseHTTPRequestHandler dictates these method names.
"docker/webhook-receiver/app.py" = ["N815"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true

